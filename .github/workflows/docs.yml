name: Docs

# Builds the page's engine from this checkout, checks that the API table still
# matches the interfaces, and publishes docs/ to GitHub Pages. Nothing under
# docs/engine/ is committed: it is rebuilt here on every push.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # moonseed is not on mooncakes yet, so CI takes it from its repository and
      # resolves it as a workspace member instead of from the registry.
      - uses: actions/checkout@v7
        with:
          repository: moonbitstack/moonseed
          path: .deps/moonseed
          persist-credentials: false

      - name: resolve the dependency from the sibling checkout
        run: printf 'members = [\n  "./.deps/moonseed",\n  ".",\n]\n' > moon.work

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: build the engine the page calls
        run: |
          moon update
          moon build --target wasm-gc --release src/examples/crackle
          mkdir -p docs/engine
          cp "$(find _build -path '*release*' -name crackle.wasm | head -1)" docs/engine/moonrand.wasm
          ls -l docs/engine

      - name: interfaces are up to date
        run: |
          moon info --target all
          git diff --exit-code

      - name: api table matches the interfaces
        run: python3 scripts/gen_api.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
