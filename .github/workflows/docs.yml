name: Docs

# Builds the page's engine from this checkout, checks that the API table still
# matches the interfaces, and publishes docs/ to GitHub Pages. Nothing under
# docs/engine/ is committed: it is rebuilt here on every push.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: build the engine the page calls
        run: |
          moon update
          moon build --target wasm-gc --release src/examples/crackle
          mkdir -p docs/engine
          cp "$(find _build -path '*release*' -name crackle.wasm | head -1)" docs/engine/moonrand.wasm
          ls -l docs/engine

      - name: interfaces are up to date
        run: |
          moon info --target all
          git diff --exit-code

      - name: the reference and the home page match the interfaces
        run: python3 scripts/gen_api.py --check

      - name: the guide matches the sections it is built from
        run: python3 scripts/gen_guide.py --check

      - name: the code in the pages compiles
        run: |
          python3 scripts/check_snippets.py
          python3 scripts/check_guide_output.py

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
